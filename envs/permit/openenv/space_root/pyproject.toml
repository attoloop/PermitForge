[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "permitforge"
version = "0.1.0"
description = "PermitForge v2 OpenEnv client"
requires-python = ">=3.11"
dependencies = ["openenv==0.7.0"]

[tool.setuptools]
packages = ["permitforge"]
package-dir = {permitforge = "."}
