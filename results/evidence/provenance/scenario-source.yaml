raw_units: 360
usable_units: 300
estimated_bytes: 6000000000
processing: 'Generated, not fetched: no upstream corpus contains permit scenarios.
  Raw = COUNT candidate scenarios drawn; usable = those passing admission (uncontrolled
  fails a NAAQS, draft passes all). The 360 -> 300 admission rate is an assumption
  for the pilot to measure. Bytes are dominated by meteorology: 5-year .sfc/.pfl per
  station, shared by many scenarios but duplicated per unit unless the foundry deduplicates
  content. The annotate operator aermod-scenario-attributes@0.1 must stamp from content/meta.json:
  station_id, archetype, n_sources, pollutants, n_binding_standards, no2_limited,
  no2_tier, downwash_sensitive, background_fraction, uncontrolled_exceedance_ratio,
  draft_cost, admissible. The ozone source for PVMRM/GRSM scenarios is an open data
  question (see Open questions). Contamination is not a concern for generated scenarios.
  Permit modeling reports from real facilities should not be used as inputs.'
