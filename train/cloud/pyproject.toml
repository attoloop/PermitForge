[project]
name = "permit-cloud-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "permit-core", "permit-openenv", "torch==2.12.1", "triton==3.7.1", "trl==1.12.0",
  "transformers==5.17.0", "peft==0.19.0", "bitsandbytes==0.49.2",
  "accelerate==1.12.0", "datasets==4.7.0", "huggingface-hub==1.33.0",
  "tokenizers==0.23.3", "psutil==7.2.2", "nvidia-ml-py==13.580.82",
  "flash-linear-attention==0.5.2",
]

[project.optional-dependencies]
metrics = ["trackio==0.42.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.uv.sources]
permit-core = {path = "../../envs/permit/core", editable = true}
permit-openenv = {path = "../../envs/permit/openenv", editable = true}
torch = {index = "pytorch-cu129"}

[tool.uv]
# Cloud training runs only on Linux x86-64 GPU hosts.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "../tests"]
pythonpath = ["../..", "../../envs/permit/core", "../../envs/permit/openenv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
