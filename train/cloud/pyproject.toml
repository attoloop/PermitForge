[project]
name = "permit-cloud-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "permit-core", "permit-openenv", "torch==2.10.0+cu128", "trl==1.12.0",
  "transformers==5.17.0", "peft==0.19.0", "bitsandbytes==0.49.2",
  "accelerate==1.12.0", "datasets==4.7.0", "huggingface-hub==1.33.0",
  "tokenizers==0.23.3", "psutil==7.2.2",
]

[project.optional-dependencies]
fast-kernels = [
  "flash-linear-attention==0.5.2",
  "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl#sha256=8e81f8c76435ad31aa41edc6c0c9d26de971a293b190183d2816da71547614d7",
]
metrics = ["trackio==0.42.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.uv.sources]
permit-core = {path = "../../envs/permit/core", editable = true}
permit-openenv = {path = "../../envs/permit/openenv", editable = true}
torch = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "../tests"]
pythonpath = ["../..", "../../envs/permit/core", "../../envs/permit/openenv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
