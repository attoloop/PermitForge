[project]
name = "permit-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "permit-core", "pytest==8.4.2", "ruff==0.14.1",
    "torch==2.10.0+cu128", "trl==1.12.0", "transformers==5.17.0",
    "peft==0.19.0", "bitsandbytes==0.49.2", "accelerate==1.12.0", "datasets==4.7.0",
]

[tool.uv.sources]
permit-core = {path = "../envs/permit/core", editable = true}
torch = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../envs/permit/core", "../envs/permit/openenv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
